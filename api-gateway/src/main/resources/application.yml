server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      # Spring Data Redis rejects an empty url outright (it's "invalid",
      # not "unset"), so this can't default to blank — it falls back to a
      # URL built from REDIS_HOST/PORT instead. Render sets REDIS_URL
      # directly (redis://:password@host:port, or rediss:// for TLS, scheme
      # implies SSL automatically); render.yaml doesn't expose a standalone
      # password property, hence the URL rather than discrete host/port/pass.
      url: ${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
      # Without these, Lettuce waits indefinitely. A Redis that accepts a
      # socket but never completes the handshake would then hang startup
      # forever rather than failing and letting the service come up
      # degraded - and on a host that health-checks an HTTP endpoint, a
      # service that never finishes starting is indistinguishable from a
      # service that crashed.
      connect-timeout: 3s
      timeout: 3s

  cloud:
    gateway:
      httpclient:
        # 15s was too tight for the free plan by a wide margin: every backend
        # this proxies to sleeps after ~15 min idle, and a cold Spring Boot
        # start alone has taken ~44s in this app (real number, from a prior
        # deploy's logs) before it can even open a listening port - let alone
        # answer a login that also has to wait on access-service and
        # security-service, which may be cold too. A response that takes
        # longer than 15s was never a broken request, just a sleeping one,
        # and the caller saw a 504 as if it were.
        #
        # 120s covers the worst realistic case render.yaml's own comment
        # already documents - "a couple of minutes" for a fully cold chain -
        # without leaving a genuinely hung request waiting forever.
        connect-timeout: 10000
        response-timeout: 120s

aegiszero:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
    issuer: aegiszero
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # Each entry accepts either a full URL (X_SERVICE_URL, what docker-compose and
  # .env.example set) or just a host:port (X_SERVICE_HOSTPORT). The second form
  # exists because Render appends a suffix to a service name when the plain name
  # is taken - aegiszero-auth-service becomes aegiszero-auth-service-y415 - and a
  # hardcoded internal URL then points at a host that does not resolve. Every
  # call through the gateway failed with a 500 that way. render.yaml now fills
  # the hostport in from the service itself, so the real name is used whatever
  # Render decided to call it.
  services:
    auth-service-url: ${AUTH_SERVICE_URL:http://${AUTH_SERVICE_HOSTPORT:localhost:8081}}
    user-service-url: ${USER_SERVICE_URL:http://${USER_SERVICE_HOSTPORT:localhost:8082}}
    access-service-url: ${ACCESS_SERVICE_URL:http://${ACCESS_SERVICE_HOSTPORT:localhost:8083}}
    security-service-url: ${SECURITY_SERVICE_URL:http://${SECURITY_SERVICE_HOSTPORT:localhost:8084}}
    audit-service-url: ${AUDIT_SERVICE_URL:http://${AUDIT_SERVICE_HOSTPORT:localhost:8085}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{correlationId}]"
