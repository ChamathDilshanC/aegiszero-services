server:
  port: 8086

spring:
  application:
    name: notification-service

  data:
    redis:
      # Carries domain events when aegiszero.events.backend=redis, on top of
      # any other use. Spring Data Redis rejects an empty url outright (it is
      # "invalid", not "unset"), so this falls back to a URL built from
      # REDIS_HOST/REDIS_PORT rather than defaulting to blank. Render sets
      # REDIS_URL directly (rediss:// implies TLS).
      url: ${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
      # Without these, Lettuce waits indefinitely. A Redis that accepts a
      # socket but never completes the handshake would then hang startup
      # forever rather than failing and letting the service come up
      # degraded - and on a host that health-checks an HTTP endpoint, a
      # service that never finishes starting is indistinguishable from a
      # service that crashed.
      connect-timeout: 3s
      timeout: 3s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl:
        mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
        jaas:
          config: ${KAFKA_SASL_JAAS_CONFIG:}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

  # Applies to the RestClient.Builder BrevoApiEmailSender is built from.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s

# smtp (default): local Mailhog, or any SMTP relay reachable from where this
#   runs (e.g. Brevo SMTP outside Render).
# brevo-api: HTTPS call to Brevo's REST API instead — the only option that
#   works on Render's free tier, which blocks outbound SMTP ports entirely.
email:
  provider: ${EMAIL_PROVIDER:smtp}

aegiszero:
  # Which broker carries domain events.
  #   kafka (default) - the real thing; docker-compose runs one locally.
  #   redis           - Redis Streams instead, for hosts that have no
  #                     reachable broker. Render's free plan is the reason
  #                     this exists. See shared/common-messaging.
  events:
    backend: ${EVENT_BACKEND:kafka}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:no-reply@aegiszero.local}
  mail-from-name: ${MAIL_FROM_NAME:AegisZero Security}
  brevo:
    api-key: ${BREVO_API_KEY:}
    api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # Spring Boot contributes a MailHealthIndicator whenever a JavaMailSender
      # bean exists, and it opens a real SMTP connection on every /actuator/health
      # probe. Two reasons that is wrong here.
      #
      # Under email.provider=brevo-api - which is what Render runs, since its free
      # tier blocks outbound SMTP entirely - it probes a transport this service
      # never uses. SMTP_HOST is left at its localhost default, nothing is
      # listening, and the indicator reports DOWN with
      # `SMTPTransport.openServer ... ConnectException: Connection refused`.
      # /actuator/health is the path Render health-checks, so a service that is
      # working perfectly gets marked unhealthy and the deploy fails.
      #
      # And under email.provider=smtp it is still the wrong signal: sending is
      # asynchronous and driven off events, so a relay being briefly unreachable
      # says nothing about whether this service is healthy. Failing a deploy
      # because a third-party relay blipped is worse than not knowing.
      enabled: false

logging:
  pattern:
    level: "%5p [%X{correlationId}]"
