server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USERNAME:aegiszero}
    password: ${DB_PASSWORD:aegiszero}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ${DB_SCHEMA:public}

  flyway:
    enabled: true
    baseline-on-migrate: true
    # On Render there is exactly one Postgres database for all five services
    # (the free plan gives you one, and its user can't CREATE DATABASE), so
    # each service owns a schema inside it instead of a database of its own.
    # Flyway creates the schema on first run and keeps its own
    # flyway_schema_history inside it, so the services stay as isolated as
    # they were with a database each. Unset -> `public`, which is what local
    # docker-compose uses against its per-service databases.
    schemas: ${DB_SCHEMA:public}
    create-schemas: true

  data:
    redis:
      # Carries domain events when aegiszero.events.backend=redis, on top of
      # any other use. Spring Data Redis rejects an empty url outright (it is
      # "invalid", not "unset"), so this falls back to a URL built from
      # REDIS_HOST/REDIS_PORT rather than defaulting to blank. Render sets
      # REDIS_URL directly (rediss:// implies TLS).
      url: ${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
      # Without these, Lettuce waits indefinitely. A Redis that accepts a
      # socket but never completes the handshake would then hang startup
      # forever rather than failing and letting the service come up
      # degraded - and on a host that health-checks an HTTP endpoint, a
      # service that never finishes starting is indistinguishable from a
      # service that crashed.
      connect-timeout: 3s
      timeout: 3s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl:
        mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
        jaas:
          config: ${KAFKA_SASL_JAAS_CONFIG:}

aegiszero:
  # Which broker carries domain events.
  #   kafka (default) - the real thing; docker-compose runs one locally.
  #   redis           - Redis Streams instead, for hosts that have no
  #                     reachable broker. Render's free plan is the reason
  #                     this exists. See shared/common-messaging.
  events:
    backend: ${EVENT_BACKEND:kafka}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
    issuer: aegiszero
    audience: aegiszero-clients
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:14}
  # Each entry accepts either a full URL (X_SERVICE_URL, what docker-compose and
  # .env.example set) or just a host:port (X_SERVICE_HOSTPORT). The second form
  # exists because Render appends a suffix to a service name when the plain name
  # is taken - aegiszero-auth-service becomes aegiszero-auth-service-y415 - and a
  # hardcoded internal URL then points at a host that does not resolve. Every
  # call through the gateway failed with a 500 that way. render.yaml now fills
  # the hostport in from the service itself, so the real name is used whatever
  # Render decided to call it.
  services:
    access-service-url: ${ACCESS_SERVICE_URL:http://${ACCESS_SERVICE_HOSTPORT:localhost:8083}}
    security-service-url: ${SECURITY_SERVICE_URL:http://${SECURITY_SERVICE_HOSTPORT:localhost:8084}}
  internal-api:
    key: ${INTERNAL_API_KEY:dev-only-internal-key-not-for-production}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{correlationId}]"
